# Cloudflare Worker: WebSocket relay on port 443 for the remote spin page (see worker.js).
# Deploy: npx wrangler deploy   (from this folder, after npx wrangler login)
name = "lucky-relay"
main = "worker.js"
compatibility_date = "2025-09-01"

[vars]
ALLOWED_ORIGINS = "https://lucky-wheel-usa.github.io"
