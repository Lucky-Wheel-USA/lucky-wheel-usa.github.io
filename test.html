<script>
(() => {
	const T = [

	const list = document.getElementById('list');
	document.getElementById('ua').textContent = navigator.userAgent;
	const mqttConnect = () => { const id = 'lwt-' + Math.random().toString(16).slice(2, 10); const b = new TextEncoder().encode(id);
		return new Uint8Array([0x10, 10 + 2 + b.length, 0, 4, 77, 81, 84, 84, 4, 2, 0, 30, 0, b.length, ...b]); };
	function probe(t) {
		return new Promise((done) => {
			const t0 = performance.now(), end = (ok, why) => { try { ws && ws.close(); } catch (e) {} clearTimeout(tm); done({ ok, why, ms: Math.round(performance.now() - t0) }); };
			let ws = null;
